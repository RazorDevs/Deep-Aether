modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_tracker}"

[[mods]]
modId = "${mod_id}"
version = "${mc_version}-${mod_version}"
displayName = "${mod_name}"
updateJSONURL = "${mod_update}"
displayURL = "${mod_url}"
logoFile = "${mod_id}.png"
credits = "${mod_credits}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[47.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aether"
mandatory=true
versionRange="[1.5.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aeroblender"
mandatory=true
versionRange="[1.0.1,)"
ordering="NONE"
side="BOTH"

